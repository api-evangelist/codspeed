aid: codspeed
name: CodSpeed
description: >-
  CodSpeed is a continuous performance testing and optimization platform that
  automatically detects performance regressions in pull requests and proposes
  autonomous optimizations. It runs benchmarks with sub-1% variance inside CI
  (GitHub Actions, GitLab CI, Buildkite), generates differential flamegraphs to
  pinpoint the exact lines that degraded, and gates PRs that fail performance
  standards. CodSpeed supports Rust, C++, Go, Java, Python, and Node.js via
  first-party harnesses (pytest-codspeed, cargo-codspeed / codspeed-rust,
  google_benchmark, JMH, vitest, tinybench, benchmark.js), CPU-simulation,
  walltime, and memory instruments, plus MongoDB database instrumentation. It
  ships an open-source CLI, a GitHub Action, a hosted MCP server, and packaged
  Agent Skills so AI coding assistants can investigate regressions and optimize
  code directly. CodSpeed is a Techstars-backed company.
